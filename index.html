<style>
:root{--bg:#EDEFF2;--surface:#fff;--ink:#16202B;--muted:#5B6673;--line:#D5DAE1;--field:#B8C0CA;--accent:#1F5FBF;--warn:#D9480F;--warn-bg:#FFF1EB;--amber:#9A6200;--amber-bg:#FFF7E0;--ok:#2B8A3E;--ok-bg:#EBF7EE;--r:6px}
*{box-sizing:border-box}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
.top{background:var(--ink);color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top select{background:#fff;color:var(--ink)}
.top .hint{color:#9AA6B2;margin-right:auto}
nav{display:flex;gap:4px;background:var(--surface);border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:14px 12px;font:inherit;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
main{max-width:1150px;margin:0 auto;padding:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:20px}
.narrow{max-width:380px;margin:40px auto}
h2{font-size:16px;margin:0 0 12px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:500;font-size:13px;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.low td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.table-wrap{overflow-x:auto}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{flex:1;min-width:180px}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--field);border-radius:var(--r);background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit}
button.primary{background:var(--accent);color:#fff;border:0;padding:9px 14px;border-radius:var(--r);font-weight:500;cursor:pointer}
button.ghost{background:none;border:1px solid var(--field);padding:6px 10px;border-radius:var(--r);cursor:pointer;color:var(--ink)}
button.danger{color:var(--warn);border-color:#F0B9A3}
button:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:6px;justify-content:flex-end}
.badge,.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.badge.exp,.tag.out,.tag.chuyen_di{background:var(--warn-bg);color:var(--warn)}
.badge.near{background:var(--amber-bg);color:var(--amber)}
.badge.ok,.tag.in,.tag.chuyen_den{background:var(--ok-bg);color:var(--ok)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:10px}
.stack label,.form-grid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
fieldset{border:0;padding:0;margin:0;min-width:0}
dialog{border:0;border-radius:8px;padding:20px;width:min(560px,92vw);color:var(--ink)}
dialog::backdrop{background:rgba(22,32,43,.5)}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--warn);font-size:13px;margin:0;min-height:1em}
.ok{color:var(--ok);font-size:14px;margin:0 0 12px}
.empty{color:var(--muted);padding:16px 0;text-align:center;margin:0}
.chk{display:inline-flex;gap:4px;margin-right:12px;font-size:13px;align-items:center;white-space:nowrap}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#slip{display:none}
.slipdoc{background:#fff;color:#000;padding:8px;font-size:13px}
.slip-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}
.slipdoc h1{font-size:18px;text-align:center;margin:0 0 6px}
.slipmeta{text-align:center;margin:0 0 14px}
.slipdoc table{width:100%;border-collapse:collapse;font-size:12px}
.slipdoc th,.slipdoc td{border:1px solid #444;padding:5px;text-align:left}
.slipdoc .r{text-align:right}
.sig{display:flex;justify-content:space-between;margin-top:36px;text-align:center}
.sig div{width:31%}
.slipfoot{margin-top:20px;color:#000}
@media print{@page{size:A4;margin:15mm}body>*:not(#slip){display:none!important}#slip{display:block!important}}
.ex-head{display:flex;justify-content:space-between;gap:16px;font-size:12px;margin-bottom:10px}
.ex-head .co{max-width:60%}
.ex-head .formno{text-align:right;max-width:40%;font-size:11px}
.center{text-align:center}
.rightdate{text-align:right}
.hdinv{text-align:right;font-size:12px;margin:8px 0}
.sig5,.sig2{display:flex;justify-content:space-between;margin-top:30px;text-align:center;font-size:11px}
.sig5 div{width:19%}
.sig2 div{width:45%}
.page{page-break-after:always}
.page:last-child{page-break-after:auto}
.ln{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ln select{flex:1}
.ln input{width:80px}
@media(max-width:900px){.grid3{grid-template-columns:1fr}}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
</style>

<body>
<div id="app"><p class="empty">Đang tải…</p></div>

<div id="slip"></div>

<dialog id="dlg">
  <form id="itemForm" onsubmit="saveItem(event)">
    <h2 id="dlgTitle"></h2>
    <div class="form-grid">
      <label>Mã hàng<input name="sku" required></label>

      <label class="full">Tên hàng<input name="nm" required></label>

      <label class="full">Loại hàng<select name="loai" onchange="loaiChanged(this.value)">
        <option value="duoc">Dược phẩm</option><option value="mypham">Mỹ phẩm</option><option value="tbyt">Thiết bị y tế</option>
      </select></label>

  </form>
</dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc, collection, getDocs, query, where, orderBy, writeBatch, runTransaction} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const fb = initializeApp({
  apiKey: "AIzaSyApVLPAgfo-Eywx0OhB-CpIY7Ymmfs2x7U",
  authDomain: "saco-d8ff2.firebaseapp.com",
  projectId: "saco-d8ff2",
  storageBucket: "saco-d8ff2.firebasestorage.app",
  messagingSenderId: "1075895325931",
  appId: "1:1075895325931:web:79002d9ae0625cf2ac1aae"
});
const auth = getAuth(fb), db = getFirestore(fb);

const NEAR = 90;
const ROLE = {admin:'Quản trị', keeper:'Thủ kho', viewer:'Người xem'};
const TYPE = {in:'Nhập', out:'Xuất', chuyen_di:'Chuyển đi', chuyen_den:'Chuyển đến'};
const LOAI = {
  duoc: {label:'Dược phẩm', fields:[['sdk','Số đăng ký'],['hoatchat','Hoạt chất'],['nhom','Nhóm thuốc',['Kê đơn','Không kê đơn','Gây nghiện','Hướng thần','Tiền chất']],['bq','Điều kiện bảo quản']]},
  mypham: {label:'Mỹ phẩm', fields:[['sdk','Số công bố'],['xx','Xuất xứ'],['pao','Hạn sau khi mở (tháng)']]},
  tbyt: {label:'Thiết bị y tế', fields:[['sdk','Số lưu hành'],['pl','Phân loại',['A','B','C','D']],['hang','Hãng sản xuất'],['xx','Xuất xứ']]}
};

const COMPANIES = {
  sacophar: {name:'CÔNG TY CỔ PHẦN THƯƠNG MẠI VÀ THIẾT BỊ Y TẾ SACOPHAR', addr:'Số 76 A2 KĐT Đại Kim, Phường Định Công, Thành phố Hà Nội, Việt Nam', mst:'0109271551'},
  sacopack: {name:'CÔNG TY TNHH THƯƠNG MẠI VÀ CÔNG NGHỆ SACOPACK', addr:'Số 76 A2 KĐT Đại Kim, đường Nguyễn Cảnh Dị, Phường Định Công, Thành phố Hà Nội, Việt Nam', mst:'0110474771'}
};
const savedPi = (() => { try { return JSON.parse(localStorage.getItem('kho-pi') || '{}'); } catch(e) { return {}; } })();
let pi = {co:'sacophar', sh:'', kh:'', nh:'', ph:'', ...savedPi};
let ox = {rcv:'', rcvAddr:'', rcvPh:'', why:'Xuất bán'};
let outLines = [{item:'', lot:'', qty:''}];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n = v => Number(v).toLocaleString('vi-VN');
const z = x => String(x).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
const dayDiff = exp => { const t = new Date(); t.setHours(0,0,0,0); return Math.round((new Date(exp + 'T00:00:00') - t) / 864e5); };
const fmtDate = s => s ? s.split('-').reverse().join('/') : '—';
const fmtTime = t => new Date(t).toLocaleString('vi-VN');
const expBadge = exp => {
  const d = dayDiff(exp);
  return d < 0 ? '<span class="badge exp">Hết hạn</span>' : d <= NEAR ? `<span class="badge near">Còn ${d} ngày</span>` : '<span class="badge ok">Còn hạn</span>';
};
const lotId = (itemId, lot, exp) => encodeURIComponent(`${itemId}|${lot}|${exp}`);
const stockIn = (list, itemId) => list.filter(l => l.itemId === itemId).reduce((s,l) => s + l.qty, 0);
const stockOf = id => stockIn(lots, id);
const whName = id => whs.find(w => w.id === id)?.name || '(đã xóa)';
const itemOf = id => items.find(x => x.id === id) || {name:'(đã xóa)', unit:'', sku:'', quy:''};
const allowed = () => isAdmin() ? whs : whs.filter(w => (me?.warehouses || []).includes(w.id));
const isAdmin = () => me?.role === 'admin';
const canKeepWh = id => isAdmin() || (me?.role === 'keeper' && (me.warehouses || []).includes(id));
const canKeepHere = () => !!wh && canKeepWh(wh);
const errMsg = e => e?.code === 'permission-denied' ? 'Bạn không có quyền thực hiện thao tác này.' : 'Thao tác không thành công. Hãy thử lại.';
const authMsg = e => ({
  'auth/invalid-credential':'Email hoặc mật khẩu không đúng.', 'auth/user-not-found':'Email hoặc mật khẩu không đúng.',
  'auth/wrong-password':'Email hoặc mật khẩu không đúng.', 'auth/invalid-email':'Email không hợp lệ.',
  'auth/email-already-in-use':'Email này đã đăng ký.', 'auth/weak-password':'Mật khẩu cần ít nhất 6 ký tự.'
}[e.code] || 'Không thực hiện được, hãy thử lại.');

let me = null, screen = 'loading', authErr = '', items = [], whs = [], users = [], wh = '', lots = [], txs = [], tab = 'stock', q = '', filterItem = '', editId = null, flash = null, justDid = false, totals = {};

const getAll = async ref => (await getDocs(ref)).docs.map(d => ({id: d.id, ...d.data()}));
const byName = (a,b) => a.name.localeCompare(b.name, 'vi');
const fail = t => { flash = {ok:false, text:t}; render(); };

function txData(whId, it, type, qty, alloc, note, after){
  return {ts: Date.now(), by: auth.currentUser?.email || '', wh: whId, itemId: it.id, sku: it.sku, name: it.name,
    unit: it.unit, quy: it.quy || '', type, qty, alloc, note: note || '', after};
}

function fefo(itemId, need, list){
  const avail = list.filter(l => l.itemId === itemId && l.qty > 0 && dayDiff(l.exp) > 0).sort((a,b) => a.exp.localeCompare(b.exp));
  let left = need;
  const allocs = [];
  for (const l of avail) {
    if (!left) break;
    const take = Math.min(l.qty, left);
    allocs.push({...l, take});
    left -= take;
  }
  return {left, allocs};
}

function applyAllocs(batch, whId, allocs){
  for (const a of allocs) {
    const ref = doc(db, 'warehouses', whId, 'lots', a.id);
    const rest = a.qty - a.take;
    if (rest > 0) batch.set(ref, {itemId: a.itemId, lot: a.lot, exp: a.exp, qty: rest, ncc: a.ncc || ''});
    else batch.delete(ref);
  }
}

async function act(fn, okText){
  try {
    await fn();
    await loadWh();
    flash = {ok:true, text:okText};
    justDid = true;
  } catch(e) {
    console.error(e);
    flash = {ok:false, text:errMsg(e)};
  }
  render();
}

onAuthStateChanged(auth, async u => {
  if (!u) { me = null; screen = 'login'; return render(); }
  const ref = doc(db, 'users', u.uid);
  let s = await getDoc(ref);
  if (!s.exists()) {
    await setDoc(ref, {email: u.email, role: null, warehouses: []});
    s = await getDoc(ref);
  }
  me = s.data();
  if (!me.role) { screen = 'pending'; return render(); }
  await loadBase();
  screen = 'app';
  render();
});

async function loadBase(){
  items = (await getAll(collection(db, 'items'))).sort(byName);
  whs = (await getAll(collection(db, 'warehouses'))).sort(byName);
  users = isAdmin() ? await getAll(collection(db, 'users')) : [];
  if (!allowed().some(w => w.id === wh)) wh = allowed()[0]?.id || '';
  await loadWh();
}

async function nextNo(t, whId, kind){
  const ref = doc(db, 'warehouses', whId, 'counters', kind);
  const s = await t.get(ref);
  const n0 = s.exists() ? (s.data().n || 0) : 0;
  t.set(ref, {n: n0 + 1});
  return `${kind}-${String(n0 + 1).padStart(5, '0')}`;
}

async function loadTotals(){
  totals = {};
  for (const w of allowed()) {
    for (const l of await getAll(collection(db, 'warehouses', w.id, 'lots'))) {
      totals[l.itemId] = (totals[l.itemId] || 0) + l.qty;
    }
  }
}

async function loadWh(){
  await loadTotals();
  if (!wh) { lots = []; txs = []; return; }
  lots = await getAll(collection(db, 'warehouses', wh, 'lots'));
  txs = await getAll(query(collection(db, 'warehouses', wh, 'txs'), orderBy('ts', 'desc')));
}

async function login(f){
  authErr = '';
  try { await signInWithEmailAndPassword(auth, f.em.value.trim(), f.pw.value); }
  catch(e) { authErr = authMsg(e); render(); }
}
async function register(f){
  authErr = '';
  try { await createUserWithEmailAndPassword(auth, f.em.value.trim(), f.pw.value); }
  catch(e) { authErr = authMsg(e); render(); }
}
const logout = () => signOut(auth);

async function setWh(v){ wh = v; flash = null; justDid = false; await loadWh(); render(); }
function setTab(t){ tab = t; flash = null; justDid = false; render(); }
function setQ(v){ q = v; drawItems(); }
function setFilter(v){ filterItem = v; render(); }

async function doIn(f){
  const it = items.find(x => x.id === f.item.value);
  const lot = f.lot.value.trim(), exp = f.exp.value, qty = parseInt(f.qty.value), ncc = f.ncc.value.trim(), note = f.note.value.trim();
  if (!it) return fail('Chọn mặt hàng.');
  if (!lot || !exp) return fail('Nhập số lô và hạn sử dụng.');
  if (dayDiff(exp) <= 0) return fail('Hạn sử dụng phải sau hôm nay.');
  if (!(qty > 0)) return fail('Số lượng phải lớn hơn 0.');
  const id = lotId(it.id, lot, exp), cur = lots.find(l => l.id === id), before = stockOf(it.id);
  await act(async () => {
    await runTransaction(db, async t => {
      const no = await nextNo(t, wh, 'PN');
      t.set(doc(db, 'warehouses', wh, 'lots', id), {itemId: it.id, lot, exp, qty: (cur?.qty || 0) + qty, ncc: cur?.ncc || ncc});
      t.set(doc(collection(db, 'warehouses', wh, 'txs')), {...txData(wh, it, 'in', qty, `${lot} (${qty})`, note, before + qty), no});
    });
  }, `Đã nhập ${n(qty)} ${it.unit} ${it.name}, lô ${lot}.`);
}

async function doOut(f){
  const it = items.find(x => x.id === f.item.value), qty = parseInt(f.qty.value);
  if (!it) return fail('Chọn mặt hàng.');
  if (!(qty > 0)) return fail('Số lượng phải lớn hơn 0.');
  const {left, allocs} = fefo(it.id, qty, lots);
  if (left > 0) return fail(`Chỉ còn ${n(qty - left)} ${it.unit} còn hạn dùng.`);
  const before = stockOf(it.id), reason = f.reason.value, note = f.note.value.trim();
  await act(async () => {
    await runTransaction(db, async t => {
      const no = await nextNo(t, wh, 'PX');
      applyAllocs(t, wh, allocs);
      t.set(doc(collection(db, 'warehouses', wh, 'txs')), {...txData(wh, it, 'out', qty,
        allocs.map(a => `${a.lot} (${a.take})`).join(', '), [reason, note].filter(Boolean).join(' · '), before - qty), no});
    });
  }, `Đã xuất ${n(qty)} ${it.unit} ${it.name}.`);
}

async function doTransfer(f){
  const to = f.to.value, it = items.find(x => x.id === f.item.value), qty = parseInt(f.qty.value), note = f.note.value.trim();
  if (!it) return fail('Chọn mặt hàng.');
  if (!to || to === wh) return fail('Chọn kho đích khác kho hiện tại.');
  if (!canKeepWh(to)) return fail('Bạn không có quyền ghi vào kho đích.');
  if (!(qty > 0)) return fail('Số lượng phải lớn hơn 0.');
  const {left, allocs} = fefo(it.id, qty, lots);
  if (left > 0) return fail(`Chỉ còn ${n(qty - left)} ${it.unit} còn hạn dùng để chuyển.`);
  let toLots;
  try { toLots = await getAll(collection(db, 'warehouses', to, 'lots')); }
  catch(e) { return fail(errMsg(e)); }
  const fromBefore = stockOf(it.id), toBefore = stockIn(toLots, it.id);
  const alloc = allocs.map(a => `${a.lot} (${a.take})`).join(', ');
  const suffix = note ? ' · ' + note : '';
  await act(async () => {
    const b = writeBatch(db);
    applyAllocs(b, wh, allocs);
    for (const a of allocs) {
      const tid = lotId(it.id, a.lot, a.exp), tc = toLots.find(l => l.id === tid);
      b.set(doc(db, 'warehouses', to, 'lots', tid), {itemId: it.id, lot: a.lot, exp: a.exp, qty: (tc?.qty || 0) + a.take, ncc: tc?.ncc || a.ncc || ''});
    }
    b.set(doc(collection(db, 'warehouses', wh, 'txs')), txData(wh, it, 'chuyen_di', qty, alloc, `Đến: ${whName(to)}${suffix}`, fromBefore - qty));
    b.set(doc(collection(db, 'warehouses', to, 'txs')), txData(to, it, 'chuyen_den', qty, alloc, `Từ: ${whName(wh)}${suffix}`, toBefore + qty));
    await b.commit();
  }, `Đã chuyển ${n(qty)} ${it.unit} ${it.name} sang ${whName(to)}.`);
}

async function destroyLot(id){
  const l = lots.find(x => x.id === id);
  if (!l) return;
  const it = itemOf(l.itemId);
  if (!confirm(`Hủy ${n(l.qty)} ${it.unit} ${it.name}, lô ${l.lot}, đã hết hạn?`)) return;
  const before = stockOf(it.id);
  await act(async () => {
    const b = writeBatch(db);
    b.delete(doc(db, 'warehouses', wh, 'lots', id));
    b.set(doc(collection(db, 'warehouses', wh, 'txs')), txData(wh, it, 'out', l.qty, `${l.lot} (${l.qty})`, 'Hủy hết hạn', before - l.qty));
    await b.commit();
  }, 'Đã hủy lô hết hạn.');
}

async function saveUser(uid){
  const role = document.getElementById('r_' + uid).value || null;
  if (uid === auth.currentUser.uid && !role) return fail('Không thể gỡ quyền của chính bạn.');
  const list = [...document.querySelectorAll(`input[data-uid="${uid}"]:checked`)].map(c => c.value);
  try {
    await updateDoc(doc(db, 'users', uid), {role, warehouses: list});
    users = await getAll(collection(db, 'users'));
    flash = {ok:true, text:'Đã lưu phân quyền.'};
  } catch(e) { flash = {ok:false, text:errMsg(e)}; }
  render();
}

async function addWh(){
  const name = document.getElementById('newWh').value.trim();
  if (!name) return fail('Nhập tên kho.');
  try {
    await setDoc(doc(collection(db, 'warehouses')), {name});
    whs = (await getAll(collection(db, 'warehouses'))).sort(byName);
    flash = {ok:true, text:`Đã tạo ${name}.`};
  } catch(e) { flash = {ok:false, text:errMsg(e)}; }
  render();
}

function attrHtml(loai, attrs = {}){
  return (LOAI[loai]?.fields || []).map(([k, l, opt]) => `<label>${l}${opt
    ? `<select name="a_${k}">${opt.map(o => `<option ${attrs[k] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`
    : `<input name="a_${k}" value="${esc(attrs[k] || '')}">`}</label>`).join('');
}
function loaiChanged(v){ $('attrs').innerHTML = attrHtml(v); }

function openItem(id){
  editId = id ?? null;
  const it = items.find(x => x.id === id) || {sku:'', name:'', unit:'', quy:'', cat:'', min:0, loai:'duoc', attrs:{}};
  const f = $('itemForm');
  $('dlgTitle').textContent = id ? 'Sửa hàng hóa' : 'Thêm hàng hóa';
  f.sku.value = it.sku; f.nm.value = it.name; f.unit.value = it.unit; f.quy.value = it.quy || '';
  f.cat.value = it.cat || ''; f.min.value = it.min || 0; f.loai.value = it.loai || 'duoc';
  $('attrs').innerHTML = attrHtml(f.loai.value, it.attrs);
  $('errItem').textContent = '';
  $('dlg').showModal();
}

async function saveItem(e){
  e.preventDefault();
  const f = e.target, err = $('errItem');
  const loai = f.loai.value;
  const d = {sku: f.sku.value.trim(), name: f.nm.value.trim(), unit: f.unit.value.trim() || 'cái', quy: f.quy.value.trim(),
    cat: f.cat.value.trim() || 'Khác', min: Math.max(0, parseInt(f.min.value) || 0), loai, attrs: {}};
  LOAI[loai].fields.forEach(([k]) => d.attrs[k] = (f['a_' + k]?.value || '').trim());
  if (!d.sku || !d.name) return err.textContent = 'Cần nhập mã và tên hàng.';
  if (items.some(x => x.sku.toLowerCase() === d.sku.toLowerCase() && x.id !== editId)) return err.textContent = 'Mã hàng đã tồn tại.';
  try {
    if (editId) await updateDoc(doc(db, 'items', editId), d);
    else await addDoc(collection(db, 'items'), d);
    $('dlg').close();
    await loadBase();
    flash = {ok:true, text:'Đã lưu hàng hóa.'};
  } catch(e2) { err.textContent = errMsg(e2); }
  render();
}

async function deleteItem(id){
  let used = 0;
  for (const w of whs) {
    used += (await getDocs(query(collection(db, 'warehouses', w.id, 'lots'), where('itemId', '==', id)))).size;
  }
  if (used) return alert('Mặt hàng còn lô trong kho, không thể xóa.');
  if (!confirm(`Xóa “${itemOf(id).name}” khỏi danh mục?`)) return;
  try {
    await deleteDoc(doc(db, 'items', id));
    await loadBase();
    flash = {ok:true, text:'Đã xóa hàng hóa.'};
  } catch(e) { flash = {ok:false, text:errMsg(e)}; }
  render();
}

function render(){
  const root = $('app');
  if (screen === 'loading') { root.innerHTML = '<p class="empty">Đang tải…</p>'; return; }
  if (screen === 'login') { root.innerHTML = loginView(); return; }
  if (screen === 'pending') { root.innerHTML = pendingView(); return; }
  root.innerHTML = appView();
  if (tab === 'items') drawItems();
}

function saveBlob(name, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function collectAll(){
  const its = await getAll(collection(db, 'items'));
  const ws = await getAll(collection(db, 'warehouses'));
  const data = {version: 2, exportedAt: new Date().toISOString(), items: its, warehouses: ws, lots: {}, txs: {}, counters: {}};
  for (const w of ws) {
    data.lots[w.id] = await getAll(collection(db, 'warehouses', w.id, 'lots'));
    data.txs[w.id] = await getAll(collection(db, 'warehouses', w.id, 'txs'));
    data.counters[w.id] = await getAll(collection(db, 'warehouses', w.id, 'counters'));
  }
  return data;
}

async function exportXlsx(){
  if (!isAdmin()) return;
  if (typeof XLSX === 'undefined') return fail('Chưa tải được thư viện Excel. Kiểm tra kết nối rồi thử lại.');
  try {
    const d = await collectAll();
    const wname = id => d.warehouses.find(w => w.id === id)?.name || '(đã xóa)';
    const itemRows = d.items.map(i => ({
      'Mã hàng': i.sku, 'Tên hàng': i.name, 'Loại': LOAI[i.loai]?.label || '', 'Quy cách': i.quy || '',
      'Đơn vị': i.unit, 'Danh mục': i.cat || '', 'Tối thiểu': i.min || 0,
      'Thuộc tính': (LOAI[i.loai]?.fields || []).map(([k, l]) => `${l}: ${i.attrs?.[k] || ''}`).join('; ')
    }));
    const lotRows = [], txRows = [];
    for (const w of d.warehouses) {
      for (const l of d.lots[w.id] || []) {
        const it = d.items.find(x => x.id === l.itemId) || {};
        lotRows.push({'Kho': w.name, 'Mã hàng': it.sku || '', 'Tên hàng': it.name || '(đã xóa)', 'Số lô': l.lot,
          'Hạn dùng': fmtDate(l.exp), 'Còn (ngày)': dayDiff(l.exp), 'Số lượng': l.qty, 'Đơn vị': it.unit || '', 'Nhà cung cấp': l.ncc || ''});
      }
      for (const t of d.txs[w.id] || []) {
        txRows.push({'Kho': w.name, 'Thời gian': fmtTime(t.ts), 'Mã hàng': t.sku, 'Tên hàng': t.name,
          'Loại': TYPE[t.type] || t.type, 'Số lượng': t.qty, 'Đơn vị': t.unit, 'Số lô': t.alloc || '',
          'Tồn sau': t.after, 'Ghi chú': t.note || '', 'Người thực hiện': t.by || ''});
      }
    }
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(itemRows), 'Hàng hóa');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(lotRows), 'Tồn theo lô');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(txRows), 'Lịch sử');
    const buf = XLSX.write(wb, {bookType: 'xlsx', type: 'array'});
    saveBlob(`kho-${ymd(new Date())}.xlsx`, new Blob([buf], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    flash = {ok: true, text: 'Đã xuất file Excel.'};
  } catch(e) {
    console.error(e);
    flash = {ok: false, text: errMsg(e)};
  }
  render();
}

async function backupJson(){
  if (!isAdmin()) return;
  try {
    const d = await collectAll();
    saveBlob(`kho-sao-luu-${ymd(new Date())}.json`, new Blob([JSON.stringify(d)], {type: 'application/json'}));
    flash = {ok: true, text: 'Đã tải file sao lưu.'};
  } catch(e) {
    console.error(e);
    flash = {ok: false, text: errMsg(e)};
  }
  render();
}

async function restoreBackup(){
  if (!isAdmin()) return;
  const file = document.getElementById('restoreFile').files[0];
  if (!file) return fail('Chọn file sao lưu trước.');
  let d;
  try { d = JSON.parse(await file.text()); }
  catch(e) { return fail('Không đọc được file.'); }
  if (d.version !== 2 || !Array.isArray(d.items) || !Array.isArray(d.warehouses) || typeof d.lots !== 'object' || typeof d.txs !== 'object')
    return fail('File không đúng định dạng sao lưu của ứng dụng này.');
  if (!confirm('Khôi phục sẽ ghi đè các mục có cùng mã. Tiếp tục?')) return;

  const ops = [];
  const add = (path, rec) => { const {id, ...data} = rec; ops.push([path, id, data]); };
  d.items.forEach(r => add(['items'], r));
  d.warehouses.forEach(r => add(['warehouses'], r));
  for (const [wh, arr] of Object.entries(d.lots)) arr.forEach(r => add(['warehouses', wh, 'lots'], r));
  for (const [wh, arr] of Object.entries(d.txs)) arr.forEach(r => add(['warehouses', wh, 'txs'], r));
  if (d.counters) for (const [wh, arr] of Object.entries(d.counters)) arr.forEach(r => add(['warehouses', wh, 'counters'], r));

  try {
    for (let i = 0; i < ops.length; i += 400) {
      const b = writeBatch(db);
      ops.slice(i, i + 400).forEach(([p, id, data]) => b.set(doc(db, ...p, id), data));
      await b.commit();
    }
    await loadBase();
    flash = {ok: true, text: `Đã khôi phục ${n(ops.length)} bản ghi.`};
  } catch(e) {
    console.error(e);
    flash = {ok: false, text: errMsg(e)};
  }
  render();
}

function printBtn(){
  if (!justDid || !txs.length) return '';
  return `<p class="ok">Đã ghi phiếu. <button class="primary" onclick="printTx(0)">${txs[0].type === 'out' ? 'In phiếu xuất' : 'In phiếu'}</button></p>`;
}

function printTx(i){
  const t = txs[i];
  if (!t) return;
  if (t.type === 'out') return printExport(t.no || t.id);
  const title = {in:'PHIẾU NHẬP KHO', out:'PHIẾU XUẤT KHO', chuyen_di:'PHIẾU CHUYỂN KHO', chuyen_den:'PHIẾU NHẬN CHUYỂN KHO'}[t.type] || 'PHIẾU KHO';
  const prefix = {in:'PN', out:'PX', chuyen_di:'CD', chuyen_den:'CN'}[t.type] || 'PK';
  const no = t.no || `${prefix}-${String(t.id || '').slice(0, 8).toUpperCase()}`;
  const isIn = ['in', 'chuyen_den'].includes(t.type);
  const it = items.find(x => x.id === t.itemId) || {};
  $('slip').innerHTML = `<div class="slipdoc">
    <div class="slip-head"><div><b>${esc(whName(t.wh))}</b></div><div>Ngày: ${fmtTime(t.ts)}</div></div>
    <h1>${title}</h1>
    <p class="slipmeta">Số phiếu: <b>${esc(no)}</b></p>
    <table><thead><tr><th>STT</th><th>Mã hàng</th><th>Tên hàng</th><th>Quy cách</th><th>ĐVT</th><th>Số lô</th><th class="r">Số lượng</th><th class="r">Tồn sau</th></tr></thead>
    <tbody><tr><td>1</td><td>${esc(t.sku)}</td><td>${esc(t.name)}</td><td>${esc(t.quy || it.quy || '')}</td><td>${esc(t.unit)}</td><td>${esc(t.alloc || '')}</td><td class="r">${n(t.qty)}</td><td class="r">${n(t.after)}</td></tr></tbody></table>
    <p><b>Ghi chú:</b> ${esc(t.note || '')}</p>
    <div class="sig">
      <div>Người lập phiếu<br><br><br>(Ký, ghi rõ họ tên)</div>
      <div>Thủ kho<br><br><br>(Ký, ghi rõ họ tên)</div>
      <div>${isIn ? 'Người giao hàng' : 'Người nhận hàng'}<br><br><br>(Ký, ghi rõ họ tên)</div>
    </div>
    <p class="slipfoot">Người thực hiện: ${esc(t.by || '')}</p>
  </div>`;
  window.print();
}

function outCard(){
  const rows = outLines.map((l, i) => {
    const its = l.item ? lots.filter(x => x.itemId === l.item && x.qty > 0 && dayDiff(x.exp) > 0).sort((a, b) => a.exp.localeCompare(b.exp)) : [];
    const unit = itemOf(l.item).unit || '';
    return `<div class="ln">
      <select onchange="pickItem(${i},this.value)">
        <option value="">-- Chọn hàng --</option>
        ${items.map(it => `<option value="${it.id}" ${it.id === l.item ? 'selected' : ''}>${esc(it.sku)} · ${esc(it.name)}</option>`).join('')}
      </select>
      <select onchange="setLine(${i},'lot',this.value)" ${l.item ? '' : 'disabled'}>
        <option value="">-- Chọn lô --</option>
        ${its.map(x => `<option value="${x.id}" ${x.id === l.lot ? 'selected' : ''}>Lô ${esc(x.lot)} · HSD ${fmtDate(x.exp)} · còn ${n(x.qty)} ${esc(unit)}</option>`).join('')}
      </select>
      <input type="number" min="1" placeholder="SL" value="${esc(l.qty)}" oninput="setLine(${i},'qty',this.value)">
      <button type="button" class="ghost danger" onclick="delLine(${i})" ${outLines.length < 2 ? 'disabled' : ''}>×</button>
    </div>`;
  }).join('');
  return `<div class="card"><h2>Xuất kho</h2>
    <p class="hint">Thông tin in phiếu (không bắt buộc, để trống nếu không cần). Lưu trên máy này.</p>
    <div class="stack">
      <label>Công ty in phiếu<select onchange="setPi('co',this.value)">
        <option value="sacophar" ${pi.co === 'sacophar' ? 'selected' : ''}>Sacophar</option>
        <option value="sacopack" ${pi.co === 'sacopack' ? 'selected' : ''}>Sacopack</option>
      </select></label>
      <label>Số hóa đơn<input value="${esc(pi.sh)}" oninput="setPi('sh',this.value)"></label>
      <label>Ký hiệu hóa đơn<input value="${esc(pi.kh)}" oninput="setPi('kh',this.value)"></label>
      <label>Ngày hóa đơn<input type="date" value="${esc(pi.nh)}" onchange="setPi('nh',this.value)"></label>
      <label>Điện thoại bên giao<input value="${esc(pi.ph)}" oninput="setPi('ph',this.value)"></label>
    </div>
    <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
    <form class="stack" onsubmit="event.preventDefault();doOutMulti()">
      <label>Người nhận hàng<input value="${esc(ox.rcv)}" oninput="setOx('rcv',this.value)" required></label>
      <label>Địa chỉ người nhận<input value="${esc(ox.rcvAddr)}" oninput="setOx('rcvAddr',this.value)"></label>
      <label>Điện thoại người nhận<input value="${esc(ox.rcvPh)}" oninput="setOx('rcvPh',this.value)"></label>
      <label>Lý do xuất kho<input value="${esc(ox.why)}" oninput="setOx('why',this.value)"></label>
      <p class="hint">Mỗi dòng là một lô: chọn hàng, chọn lô, nhập số lượng. Muốn xuất nhiều lô của cùng một hàng, thêm nhiều dòng.</p>
      ${rows}
      <button type="button" class="ghost" onclick="addLine()">+ Thêm dòng</button>
      <button class="primary">Ghi phiếu xuất</button>
    </form>
  </div>`;
}

function pickItem(i, v){
  outLines[i].item = v;
  outLines[i].lot = '';
  render();
}

function setPi(k, v){
  pi[k] = v;
  try { localStorage.setItem('kho-pi', JSON.stringify(pi)); } catch(e) {}
}
function setOx(k, v){ ox[k] = v; }
function setLine(i, k, v){ outLines[i][k] = v; }
function addLine(){ outLines.push({item:'', lot:'', qty:''}); render(); }
function delLine(i){ outLines.splice(i, 1); render(); }

async function doOutMulti(){
  const reqs = outLines.filter(l => l.item || l.lot || l.qty).map(l => ({it: items.find(x => x.id === l.item), lot: lots.find(x => x.id === l.lot), qty: parseInt(l.qty)}));
  if (!reqs.length) return fail('Thêm ít nhất một dòng hàng.');
  if (reqs.some(r => !r.it)) return fail('Chọn mặt hàng cho từng dòng.');
  if (reqs.some(r => !r.lot || r.lot.itemId !== r.it.id)) return fail('Chọn lô cho từng dòng.');
  if (reqs.some(r => !(r.qty > 0))) return fail('Số lượng mỗi dòng phải lớn hơn 0.');
  if (reqs.some(r => dayDiff(r.lot.exp) <= 0)) return fail('Có lô đã hết hạn, không xuất được.');
  if (!ox.rcv.trim()) return fail('Nhập tên người nhận hàng.');
  const used = {};
  for (const r of reqs) {
    used[r.lot.id] = (used[r.lot.id] || 0) + r.qty;
    if (used[r.lot.id] > r.lot.qty) return fail(`Lô ${r.lot.lot}: chỉ còn ${n(r.lot.qty)}, đang xuất ${n(used[r.lot.id])}.`);
  }
  let noOut = '';
  await act(async () => {
    await runTransaction(db, async t => {
      noOut = await nextNo(t, wh, 'PX');
      for (const id of Object.keys(used)) {
        const l = lots.find(x => x.id === id), rest = l.qty - used[id], ref = doc(db, 'warehouses', wh, 'lots', id);
        if (rest > 0) t.set(ref, {itemId: l.itemId, lot: l.lot, exp: l.exp, qty: rest, ncc: l.ncc || ''});
        else t.delete(ref);
      }
      const run = {};
      for (const r of reqs) {
        const it = r.it;
        if (!(it.id in run)) run[it.id] = stockOf(it.id);
        run[it.id] -= r.qty;
        const parts = [{lot: r.lot.lot, exp: r.lot.exp, take: r.qty}];
        t.set(doc(collection(db, 'warehouses', wh, 'txs')), {
          ...txData(wh, it, 'out', r.qty, `${r.lot.lot} (${r.qty})`, ox.why, run[it.id]),
          no: noOut, parts, rcv: ox.rcv, rcvAddr: ox.rcvAddr, rcvPh: ox.rcvPh
        });
      }
    });
    outLines = [{item:'', lot:'', qty:''}];
  }, 'Đã ghi phiếu xuất.');
  if (noOut) { flash = {ok: true, text: `Đã ghi phiếu xuất ${noOut}.`}; render(); }
}

function printExport(key){
  const rows = txs.filter(x => x.type === 'out' && (x.no || x.id) === key).slice().reverse();

  const h = rows[0], co = COMPANIES[pi.co] || COMPANIES.sacophar;

      <div class="formno"><b>MẪU SỐ 02 - VT</b><br><i>Kèm theo Thông tư số 99/2025/TT-BTC ngày 27 tháng 10 năm 2025 của Bộ Tài chính</i></div></div>
    <h1>PHIẾU XUẤT KHO</h1>
    <p class="center"><i>${ngay}</i></p>

    <p>Họ và tên người nhận hàng: <b>${esc(h.rcv)}</b></p>

    <p>Xuất tại kho: ${esc(whName(h.wh))} &nbsp;&nbsp; Địa điểm: ${co.addr}</p>
    <table><thead><tr><th>STT</th><th>Tên hàng hóa</th><th>Mã số</th><th>Lô</th><th>HSD</th><th>ĐVT</th><th class="r">Số lượng</th></tr></thead>
    <tbody>${lines.map((l, i) => `<tr><td>${i + 1}</td><td>${esc(l.name)}</td><td>${esc(l.sku)}</td><td>${esc(l.lot)}</td><td>${exp(l.exp)}</td><td>${esc(l.unit)}</td><td class="r">${n(l.qty)}</td></tr>`).join('')}
    <tr><td colspan="6" class="r"><b>Cộng</b></td><td class="r"><b>${n(total)}</b></td></tr></tbody></table>
    <p>Tổng số tiền (viết bằng chữ): ...............................................................................</p>
    <p>Số chứng từ gốc kèm theo: ...................................................................................</p>
    <p class="rightdate"><i>${ngay}</i></p>
    <div class="sig5">
      <div><b>NGƯỜI LẬP PHIẾU</b><br><i>(Ký, họ tên)</i></div>
      <div><b>NGƯỜI NHẬN HÀNG</b><br><i>(Ký, họ tên)</i></div>
      <div><b>THỦ KHO</b><br><i>(Ký, họ tên)</i></div>
      <div><b>KẾ TOÁN TRƯỞNG</b><br><i>(Ký, họ tên)</i></div>
      <div><b>GIÁM ĐỐC</b><br><i>(Ký, họ tên)</i></div>
    </div>
  </div>`;
  const pageBB = `<div class="page">
    <div class="ex-head"><div class="co"><b>${co.name}</b><br>${co.addr}<br>Mã số thuế: ${co.mst}</div>
      <div class="formno"><b>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</b><br><i>Độc lập - Tự do - Hạnh phúc</i></div></div>
    <h1>BIÊN BẢN GIAO HÀNG HOÁ</h1>
    ${hd}
    <p><b>Bên A (Bên nhận hàng):</b> ${esc(h.rcv)}</p>
    <p>Địa chỉ: ${esc(h.rcvAddr)}</p>
    <p>Điện thoại: ${esc(h.rcvPh)}</p>
    <p><b>Bên B (Bên giao hàng):</b> ${co.name}</p>
    <p>Địa chỉ: ${co.addr}</p>
    <p>Điện thoại: ${esc(pi.ph)}</p>
    <p><i>Hai bên cùng nhau thống nhất số lượng giao hàng như sau:</i></p>
    <table><thead><tr><th>STT</th><th>Mã hàng</th><th>Tên hàng</th><th>Số lô</th><th>HSD</th><th>ĐVT</th><th class="r">Số lượng</th></tr></thead>
    <tbody>${lines.map((l, i) => `<tr><td>${i + 1}</td><td>${esc(l.sku)}</td><td>${esc(l.name)}</td><td>${esc(l.lot)}</td><td>${exp(l.exp)}</td><td>${esc(l.unit)}</td><td class="r">${n(l.qty)}</td></tr>`).join('')}</tbody></table>
    <div class="sig2">
      <div><b>ĐẠI DIỆN BÊN A</b><br><i>(Ký, ghi rõ họ tên)</i></div>

Object.assign(window, {login, register, logout, setWh, setTab, setQ, setFilter, doIn, doOut, doTransfer, destroyLot,
